<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<meta name="description" content="Mufa Snack — game arcade ular dengan 12 mode permainan. Tanpa unduhan, tanpa akun.">
<title>Mufa Snack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b1a'/%3E%3Crect x='6' y='13' width='20' height='6' rx='3' fill='%233ddc84'/%3E%3Ccircle cx='24' cy='9' r='3' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-dpad="auto">
<main id="app">
  <section id="screen-menu" class="screen active">
    <header class="menu-head">
      <h1 class="logo">MUFA <span>SNAKE</span></h1>
      <p class="tagline">Arcade · Snake · Strategy · Survival <br>100% Vidbe Coding</p>
    </header>
    <div class="menu-row">
      <h2 class="section-title" data-i18n="menu.difficulty">Kesulitan</h2>
      <div id="difficulty" class="chips"></div>
    </div>
    <h2 class="section-title" data-i18n="menu.modes">Pilih mode</h2>
    <div id="mode-grid" class="mode-grid"></div>
    <div class="menu-footer">
      <button id="btn-play" class="btn primary big" data-i18n="menu.play">Play</button>
      <div class="menu-nav">
        <button id="btn-stats" class="btn" data-i18n="menu.stats">Statistik</button>
        <button id="btn-ach" class="btn" data-i18n="menu.achievements">Pencapaian</button>
        <button id="btn-settings" class="btn" data-i18n="menu.settings">Pengaturan</button>
        <button id="btn-help" class="btn" data-i18n="menu.help">Bantuan</button>
      </div>
    </div>
  </section>

  <section id="screen-game" class="screen">
    <header class="hud">
      <div class="hud-item"><span class="label" data-i18n="hud.score">Skor</span><b id="hud-score">0</b></div>
      <div class="hud-item"><span class="label" data-i18n="hud.best">Rekor</span><b id="hud-best">0</b></div>
      <div id="hud-extra" class="hud-extra"></div>
      <div class="hud-actions">
        <button id="btn-pause" class="btn icon" data-i18n="hud.pause">Jeda</button>
        <button id="btn-restart" class="btn icon" data-i18n="hud.restart">Ulang</button>
        <button id="btn-menu" class="btn icon" data-i18n="hud.menu">Menu</button>
      </div>
    </header>
    <div id="arena-wrap">
      <div class="arena-box">
        <canvas id="arena"></canvas>
        <div id="overlay" class="overlay hidden" aria-live="polite">
          <h2 id="ov-title"></h2>
          <p id="ov-text"></p>
          <div id="ov-actions" class="ov-actions"></div>
        </div>
      </div>
    </div>
    <div class="dpad" aria-label="Kontrol arah">
      <button data-dir="up" class="up" aria-label="Atas">▲</button>
      <button data-dir="left" class="left" aria-label="Kiri">◀</button>
      <button data-dir="right" class="right" aria-label="Kanan">▶</button>
      <button data-dir="down" class="down" aria-label="Bawah">▼</button>
    </div>
  </section>
</main>

<div id="panel" class="panel hidden" role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div class="panel-card">
    <header class="panel-head">
      <h2 id="panel-title"></h2>
      <button id="panel-close" class="btn icon" data-i18n="common.close">Tutup</button>
    </header>
    <div id="panel-body" class="panel-body"></div>
  </div>
</div>

<script src="js/utils/grid.js"></script>
<script src="js/utils/random.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/achievements.js"></script>
<script src="js/audio.js"></script>
<script src="js/collision.js"></script>
<script src="js/scoring.js"></script>
<script src="js/renderer.js"></script>
<script src="js/input.js"></script>
<script src="js/game-engine.js"></script>
<script src="js/modes/classic.js"></script>
<script src="js/modes/time-rush.js"></script>
<script src="js/modes/maze-runner.js"></script>
<script src="js/modes/snack-hunter.js"></script>
<script src="js/modes/danger-zone.js"></script>
<script src="js/modes/portal-snack.js"></script>
<script src="js/modes/color-rules.js"></script>
<script src="js/modes/mystery-snack.js"></script>
<script src="js/modes/no-growth.js"></script>
<script src="js/modes/combo-chain.js"></script>
<script src="js/modes/path-master.js"></script>
<script src="js/modes/endless-survival.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
